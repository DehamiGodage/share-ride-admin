openapi: 3.0.3
info:
  title: Share-Ride Admin API
  version: 0.1.0-draft
  description: |
    Contract between the admin web panel (frontend) and the Admin API (backend).
    Source: Admin Web Panel Page-by-Page Design Specification (pages P01 to P26).
    STATUS: DRAFT for team review. Freeze by day 2. After the freeze, any change to an
    endpoint must update this file in the same pull request and notify the frontend owner.

    ## Conventions (everyone follows these)
    - Base URL: http://localhost:4000. Public routes: /health and /auth/*. Everything under /admin needs a token.
    - Success, one record:  { "data": { ... } }
    - Success, list:        { "data": [ ... ], "meta": { "page": 1, "limit": 25, "total": 120, "updatedAt": "..." } }
    - Error (all failures): { "error": { "code": "FORBIDDEN", "message": "...", "details": [ ... ] } }
    - Error codes: VALIDATION_ERROR 400, UNAUTHENTICATED 401, FORBIDDEN 403, NOT_FOUND 404,
      CONFLICT 409 (record changed by someone else), LOCKED 423 (account locked), RATE_LIMITED 429, SERVER_ERROR 500.
    - Lists accept: page (from 1), limit (25, 50 or 100), sort (field:asc or field:desc), q (search text), plus filters named in each endpoint.
    - IDs have prefixes: USR-, DR-, APP-, VEH-, R- (ride), BK-, SOS-, RPT-, NTF-.
    - Times are ISO 8601 in UTC. The frontend shows them in Asia/Colombo. Money is a number in Rs. (whole rupees).
    - Masked by default: email, mobile, NIC, licence number, address and date of birth. Full values only through a reveal endpoint, which writes an audit entry.
    - Risky actions (suspend, reject, cancel, hide, change a setting, break-glass) need a written "reason" in the body.
    - Editable records carry a "version" number. Send it back when saving. A mismatch returns 409 CONFLICT.
    - "x-permission" on each operation is the area:level passed to requirePermission(area, level) in the backend. "x-page" is the page ID from the design document.
    - Every module publishes a "GET /admin/<module>/summary" endpoint used by the Dashboard (P03).
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Account
  - name: Admins
  - name: Dashboard
  - name: Users
  - name: Driver applications
  - name: Drivers and vehicles
  - name: Rides and bookings
  - name: Live
  - name: Safety
  - name: Reports
  - name: Ratings
  - name: Notifications
  - name: Settings
  - name: Content
  - name: Analytics
  - name: Audit
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Public health check
      security: []
      responses:
        '200':
          description: Backend is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ---------------- P01, P02 Auth (public) ----------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Step 1, email and password
      x-page: P01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Credentials accepted. If 2-step is needed, the response holds a short-lived challenge token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      twoFactorRequired: { type: boolean }
                      challengeToken: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Step 2, six-digit code or backup code
      x-page: P01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              properties:
                challengeToken: { type: string }
                code: { type: string, example: '123456' }
                backupCode: { type: string }
                trustDevice: { type: boolean, description: Trust this device for 30 days }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/2fa/resend:
    post:
      tags: [Auth]
      summary: Resend the code (allowed 30 seconds after the last one)
      x-page: P01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              properties:
                challengeToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ack' }
        default: { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Get a new access token
      x-page: P01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out this session
      x-page: P01
      responses:
        '200': { $ref: '#/components/responses/Ack' }
        default: { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send a reset link. Always answers the same, whether or not the email exists.
      x-page: P02
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Ack' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password (12+ characters, link valid 30 minutes, one use). Signs out other sessions.
      x-page: P02
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        '200': { $ref: '#/components/responses/Ack' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------- P25 My account ----------------
  /admin/me:
    get:
      tags: [Account]
      summary: Current admin (id, name, email, role). Also used to check the auth stub.
      x-page: P25
      x-permission: any signed-in admin
      responses:
        '200':
          description: Current admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AdminUser' }
  /admin/account:
    get:
      tags: [Account]
      summary: Profile, alert preferences, time zone
      x-page: P25
      x-permission: any signed-in admin
      responses:
        '200': { $ref: '#/components/responses/Object' }
    patch:
      tags: [Account]
      summary: Update profile or alert preferences
      x-page: P25
      x-permission: any signed-in admin
      requestBody: { $ref: '#/components/requestBodies/AnyObject' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/account/change-password:
    post:
      tags: [Account]
      summary: Change password (12+ characters)
      x-page: P25
      x-permission: any signed-in admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        '200': { $ref: '#/components/responses/Ack' }
        default: { $ref: '#/components/responses/Error' }
  /admin/account/2fa/setup:
    post:
      tags: [Account]
      summary: Start 2-step setup. Returns the QR code data and backup codes.
      x-page: P25
      x-permission: any signed-in admin
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/account/sessions:
    get:
      tags: [Account]
      summary: Active sessions (device, location, last seen)
      x-page: P25
      x-permission: any signed-in admin
      responses:
        '200': { $ref: '#/components/responses/List' }
  /admin/account/sessions/{id}:
    delete:
      tags: [Account]
      summary: Sign out one session
      x-page: P25
      x-permission: any signed-in admin
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ack' }

  # ---------------- P24 Admin accounts ----------------
  /admin/admins:
    get:
      tags: [Admins]
      summary: List admins (name, email, role, status, last sign-in, 2-step on/off)
      x-page: P24
      x-permission: admin_accounts:view
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Q' }]
      responses:
        '200': { $ref: '#/components/responses/List' }
  /admin/admins/invite:
    post:
      tags: [Admins]
      summary: Invite an admin (email link valid 48 hours)
      x-page: P24
      x-permission: admin_accounts:full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201': { $ref: '#/components/responses/Object' }
        default: { $ref: '#/components/responses/Error' }
  /admin/admins/{id}/role:
    patch:
      tags: [Admins]
      summary: Change role (not your own, and at least two SuperAdmins must remain)
      x-page: P24
      x-permission: admin_accounts:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        default: { $ref: '#/components/responses/Error' }
  /admin/admins/{id}/deactivate:
    post:
      tags: [Admins]
      summary: Deactivate an admin
      x-page: P24
      x-permission: admin_accounts:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/Ack' }
  /admin/admins/{id}/force-signout:
    post:
      tags: [Admins]
      summary: Sign an admin out of every session
      x-page: P24
      x-permission: admin_accounts:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ack' }
  /admin/admins/{id}/reset-2fa:
    post:
      tags: [Admins]
      summary: Reset 2-step verification for an admin
      x-page: P24
      x-permission: admin_accounts:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/Ack' }
  /admin/roles:
    get:
      tags: [Admins]
      summary: The four built-in roles and their permission matrix (read-only)
      x-page: P24
      x-permission: admin_accounts:view
      responses:
        '200': { $ref: '#/components/responses/Object' }

  # ---------------- P03 Dashboard and global search ----------------
  /admin/dashboard:
    get:
      tags: [Dashboard]
      summary: Needs-attention cards, KPIs, charts and queues for a date range. Cached 60 seconds.
      x-page: P03
      x-permission: dashboard:view
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [today, 7d, 30d, custom] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/search:
    get:
      tags: [Dashboard]
      summary: Global search (Ctrl+K) across users, rides, bookings, reports and vehicles
      x-page: Shell
      x-permission: any signed-in admin
      parameters: [{ $ref: '#/components/parameters/Q' }]
      responses:
        '200': { $ref: '#/components/responses/List' }

  # ---------------- P04, P05 Users ----------------
  /admin/users:
    get:
      tags: [Users]
      summary: List users with masked contact data
      x-page: P04
      x-permission: users:view
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Q' }
        - { name: tab, in: query, schema: { type: string, enum: [all, passengers, drivers, suspended, new] } }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended] } }
        - { name: gender, in: query, schema: { type: string } }
        - { name: applicationStatus, in: query, schema: { type: string } }
        - { name: joinedFrom, in: query, schema: { type: string, format: date } }
        - { name: joinedTo, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserListItem' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
  /admin/users/summary:
    get:
      tags: [Users]
      summary: Counts for the Dashboard
      x-page: P03
      x-permission: users:view
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totalUsers: { type: integer }
                      newLast7Days: { type: integer }
                      suspended: { type: integer }
  /admin/users/{id}:
    get:
      tags: [Users]
      summary: One user (tabs are loaded by the sub-resources below). Contact data is masked.
      x-page: P05
      x-permission: users:view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/{tab}:
    get:
      tags: [Users]
      summary: One tab of the user detail page
      x-page: P05
      x-permission: users:view
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: tab, in: path, required: true, schema: { type: string, enum: [driver, rides, bookings, ratings, reports, notifications, activity] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/List' }
  /admin/users/{id}/reveal:
    post:
      tags: [Users]
      summary: Reveal masked fields. Writes user.reveal_contact to the audit log.
      x-page: P05
      x-permission: users:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, reason]
              properties:
                fields:
                  type: array
                  items: { type: string, enum: [email, mobile, nic, licenceNumber, address, dateOfBirth] }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        default: { $ref: '#/components/responses/Error' }
  /admin/users/{id}/suspend:
    post:
      tags: [Users]
      summary: Suspend a user. Cannot suspend yourself or a SuperAdmin.
      x-page: P05
      x-permission: users:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                until: { type: string, format: date-time, description: Omit for permanent }
                cancelUpcoming: { type: boolean }
                notifyUser: { type: boolean }
                version: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        default: { $ref: '#/components/responses/Error' }
  /admin/users/{id}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate a user
      x-page: P05
      x-permission: users:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/users/{id}/force-signout:
    post:
      tags: [Users]
      summary: Sign the user out of the mobile app everywhere
      x-page: P04
      x-permission: users:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ack' }
  /admin/users/{id}/notes:
    get:
      tags: [Users]
      summary: Internal notes timeline
      x-page: P05
      x-permission: users:view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/List' }
    post:
      tags: [Users]
      summary: Add an internal note
      x-page: P05
      x-permission: users:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Object' }

  # ---------------- P06, P07 Driver applications ----------------
  /admin/driver-applications:
    get:
      tags: [Driver applications]
      summary: Verification queue
      x-page: P06
      x-permission: driver_applications:view
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Q' }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, under_review, approved, rejected, suspended] } }
        - { name: assignedTo, in: query, schema: { type: string, description: 'me, unassigned or an admin ID' } }
        - { name: waitingOverHours, in: query, schema: { type: integer } }
        - { name: resubmitted, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Paged applications with tab counts in meta.counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverApplicationListItem' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
  /admin/driver-applications/summary:
    get:
      tags: [Driver applications]
      summary: Counts for the Dashboard
      x-page: P03
      x-permission: driver_applications:view
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pending: { type: integer }
                      underReview: { type: integer }
                      oldestWaitingHours: { type: number }
  /admin/driver-applications/{id}:
    get:
      tags: [Driver applications]
      summary: Open an application. Marks it Under review and locks it to the opening admin.
      x-page: P07
      x-permission: driver_applications:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/driver-applications/{id}/assign:
    post:
      tags: [Driver applications]
      summary: Assign to me or to another admin
      x-page: P06
      x-permission: driver_applications:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adminId: { type: string, description: Omit to assign to me }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/driver-applications/{id}/documents/{docType}:
    get:
      tags: [Driver applications]
      summary: Short-lived watermarked URL for one document. Writes document.view to the audit log.
      x-page: P07
      x-permission: driver_applications:full
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: docType, in: path, required: true, schema: { type: string, enum: [nic_front, nic_back, licence_front, licence_back, live_photo, profile_photo, revenue_licence, cr_book, insurance, vehicle_photos] } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/driver-applications/{id}/checklist:
    put:
      tags: [Driver applications]
      summary: Save the checklist (matches, does not match, cannot read) and notes
      x-page: P07
      x-permission: driver_applications:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/AnyObject' }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/driver-applications/{id}/approve:
    post:
      tags: [Driver applications]
      summary: Approve the driver. Needs every document viewed and every checklist line answered.
      x-page: P07
      x-permission: driver_applications:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Object' }
        default: { $ref: '#/components/responses/Error' }
  /admin/driver-applications/{id}/reject:
    post:
      tags: [Driver applications]
      summary: Reject with a reason shown to the user
      x-page: P07
      x-permission: driver_applications:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonTemplate, reason]
              properties:
                reasonTemplate: { type: string, enum: [document_unreadable, document_expired, details_mismatch, photo_mismatch, duplicate_account, other] }
                reason: { type: string }
                allowResubmission: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/driver-applications/{id}/request-info:
    post:
      tags: [Driver applications]
      summary: Ask the applicant for missing items. Application stays Under review.
      x-page: P07
      x-permission: driver_applications:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ack' }
  /admin/driver-applications/{id}/release:
    post:
      tags: [Driver applications]
      summary: Release the review lock
      x-page: P07
      x-permission: driver_applications:full
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ack' }

  # ---------------- P08, P09 Drivers and vehicles ----------------
  /admin/drivers:
    get:
      tags: [Drivers and vehicles]
      summary: Approved drivers and compliance
      x-page: P08
      x-permission: drivers_vehicles:view
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Q' }
        - { name: tab, in: query, schema: { type: string, enum: [all, expiring, expired, low_reliability, suspended] } }
      responses:
        '200': { $ref: '#/components/responses/List' }
