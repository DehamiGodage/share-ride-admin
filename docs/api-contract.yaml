      x-page: P22
      x-permission: audit_log:full
      requestBody: { $ref: '#/components/requestBodies/AnyObject' }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  # ---------------- P23 System health ----------------
  /admin/system/health:
    get:
      tags: [System]
      summary: Services, dependencies, providers, jobs, gauges, alerts and last 100 errors
      x-page: P23
      x-permission: system_health:view
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/system/maintenance:
    post:
      tags: [System]
      summary: Turn maintenance mode on or off (SuperAdmin)
      x-page: P23
      x-permission: system_health:full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled: { type: boolean }
                message: { type: string }
                expectedBackAt: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Object' }
  /admin/system/clear-cache:
    post:
      tags: [System]
      summary: Clear caches (SuperAdmin)
      x-page: P23
      x-permission: system_health:full
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/Ack' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token with a role claim. Until real login exists, the auth stub accepts every request (header x-dev-role switches role).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, enum: [25, 50, 100], default: 25 }
    Sort:
      name: sort
      in: query
      description: field:asc or field:desc
      schema: { type: string }
    Q:
      name: q
      in: query
      description: Search text
      schema: { type: string }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string }
    AnyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  responses:
    Error:
      description: Failure, see error codes in the description at the top
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Ack:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  ok: { type: boolean, example: true }
    Object:
      description: One record. Exact fields are finalised per page during review.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, additionalProperties: true }
    List:
      description: A paged list. Exact item fields are finalised per page during review.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { type: object, additionalProperties: true }
              meta: { $ref: '#/components/schemas/ListMeta' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, LOCKED, RATE_LIMITED, SERVER_ERROR]
            message: { type: string }
            details:
              type: array
              items: { type: object, additionalProperties: true }
    ListMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        updatedAt: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: Tab counts where a page has tabs
    Role:
      type: string
      enum: [super_admin, operations, safety, analyst]
    AdminUser:
      type: object
      properties:
        id: { type: string, example: USR-0001 }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 'In seconds' }
        user: { $ref: '#/components/schemas/AdminUser' }
    UserListItem:
      type: object
      properties:
        id: { type: string, example: USR-1042 }
        name: { type: string }
        photoUrl: { type: string }
        email: { type: string, example: 'd***@gmail.com' }
        mobile: { type: string, example: '+94 77 *** 4567' }
        roles: { type: array, items: { type: string, enum: [passenger, driver] } }
        status: { type: string, enum: [active, suspended] }
        mobileVerified: { type: boolean }
        emailVerified: { type: boolean }
        applicationStatus: { type: string, nullable: true }
        rating: { type: number, nullable: true }
        ratingCount: { type: integer }
        reliabilityScore: { type: number, nullable: true }
        ridesAsDriver: { type: integer }
        bookingsAsPassenger: { type: integer }
        joinedAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        version: { type: integer }
    DriverApplicationListItem:
      type: object
      properties:
        id: { type: string, example: APP-0231 }
        applicantName: { type: string }
        photoUrl: { type: string }
        submittedAt: { type: string, format: date-time }
        waitingHours: { type: number }
        documentsComplete: { type: integer, example: 8 }
        documentsRequired: { type: integer, example: 8 }
        vehicleCount: { type: integer }
        status: { type: string, enum: [draft, submitted, under_review, approved, rejected, suspended] }
        assignedTo: { type: string, nullable: true }
        resubmissionCount: { type: integer }
    RideListItem:
      type: object
      properties:
        id: { type: string, example: R-5521 }
        driver:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            rating: { type: number }
        from: { type: string }
        to: { type: string }
        stopCount: { type: integer }
        departureAt: { type: string, format: date-time }
        seatsBooked: { type: integer }
        seatsTotal: { type: integer }
        pricePerSeat: { type: number, description: 'Full route, in Rs.' }
        status: { type: string, enum: [draft, published, in_progress, completed, cancelled] }
        modes: { type: array, items: { type: string, enum: [advance, instant_join, entire_ride] } }
        preference: { type: string, enum: [anyone, women_only, men_only] }
        bookingsCount: { type: integer }
        flagged: { type: boolean }
        createdAt: { type: string, format: date-time }
    SosAlert:
      type: object
      properties:
        id: { type: string, example: SOS-0042 }
        raisedBy: { type: string, enum: [passenger, driver] }
        raisedAt: { type: string, format: date-time }
        rideId: { type: string }
        position:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
        trustedContactsNotified: { type: boolean }
        status: { type: string, enum: [active, acknowledged, escalated, resolved, false_alarm] }
        assignedTo: { type: string, nullable: true }
        responseSeconds: { type: integer, nullable: true }
    ReportListItem:
      type: object
      properties:
        id: { type: string, example: RPT-0310 }
        category: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        reporterId: { type: string }
        reportedUserId: { type: string }
        rideId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [open, in_review, resolved, dismissed] }
        assignedTo: { type: string, nullable: true }
        responseDueAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        adminId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        action: { type: string, example: user.suspend }
        targetType: { type: string }
        targetId: { type: string }
        result: { type: string, enum: [success, failure] }
        ip: { type: string }
        reason: { type: string, nullable: true }
        before: { type: object, nullable: true, additionalProperties: true }
        after: { type: object, nullable: true, additionalProperties: true }